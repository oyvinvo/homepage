# ==============================================================================
# Local Development Docker Compose for AGV Portfolio Application
# KulturIT Operations Standard (Constitution Article V)
# Run: docker compose up --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Application Service (AGV Portfolio Frontend SPA)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agv-portfolio-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/agv_portfolio_dev}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Relational Database (PostgreSQL)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: agv-portfolio-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-agv_portfolio_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
